name: Backup diario Supabase

on:
  schedule:
    - cron: '0 7 * * *'  # 2 AM Bogotá = 07:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Instalar PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar nombre del archivo
        id: filename
        run: echo "name=backup_$(date +'%Y-%m-%d_%H%M').sql" >> $GITHUB_OUTPUT

      - name: Debug — verificar longitud de password (sin exponerla)
        env:
          PWD_LEN: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Longitud de la password (para verificar que llegó completa)
          LEN=$(echo -n "$PWD_LEN" | wc -c)
          echo "Longitud del Secret SUPABASE_DB_PASSWORD: $LEN caracteres"
          # Primer y último caracter (útil para detectar espacios pegados)
          FIRST=$(echo -n "$PWD_LEN" | head -c 1)
          LAST=$(echo -n "$PWD_LEN" | tail -c 1)
          echo "Primer char (código ASCII): $(printf '%d' "'$FIRST")"
          echo "Último char (código ASCII): $(printf '%d' "'$LAST")"

      - name: Crear archivo .pgpass
        env:
          PGPASSWORD_RAW: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST_RAW: ${{ secrets.SUPABASE_DB_HOST }}
        run: |
          # Formato .pgpass: hostname:port:database:username:password
          # * como wildcard permite conectar a cualquier DB del mismo host
          echo "${PGHOST_RAW}:5432:*:postgres.qhjditntqtjiljeftqun:${PGPASSWORD_RAW}" > ~/.pgpass
          chmod 600 ~/.pgpass
          echo "Archivo .pgpass creado en ~/.pgpass con permisos 600"
          # Verificar que se escribió (sin mostrar la password)
          LINES=$(wc -l < ~/.pgpass)
          echo "Líneas en .pgpass: $LINES (debe ser 1)"

      - name: Ejecutar pg_dump usando .pgpass
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: 5432
          PGUSER: postgres.qhjditntqtjiljeftqun
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          echo "Conectando como: $PGUSER"
          echo "A host: $PGHOST puerto: $PGPORT"
          echo "SSL mode: $PGSSLMODE"
          echo "---"
          pg_dump \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            --schema=public \
            --verbose \
            > ${{ steps.filename.outputs.name }}
          echo "---"
          echo "Archivo generado:"
          ls -lh ${{ steps.filename.outputs.name }}
          echo "Comprimiendo..."
          gzip ${{ steps.filename.outputs.name }}
          echo "Archivo comprimido:"
          ls -lh ${{ steps.filename.outputs.name }}.gz

      - name: Limpiar .pgpass
        if: always()
        run: rm -f ~/.pgpass

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.name }}
          path: ${{ steps.filename.outputs.name }}.gz
          retention-days: 90

      - name: Reportar resultado
        if: success()
        run: echo "✅ Backup exitoso. Retención 90 días."
