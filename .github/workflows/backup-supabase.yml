name: Backup diario Supabase

on:
  schedule:
    - cron: '0 7 * * *'  # 2 AM Bogotá = 07:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Instalar PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar nombre del archivo
        id: filename
        run: echo "name=backup_$(date +'%Y-%m-%d_%H%M').sql" >> $GITHUB_OUTPUT

      - name: Debug - Verificar lectura de contraseña
        env:
          DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          LEN=$(echo -n "$DB_PASS" | wc -c)
          echo "GitHub está inyectando una contraseña de: $LEN caracteres."
          echo "⚠️ Si este número es mayor al tamaño real de tu contraseña, hay un espacio en blanco al final de tu Secret."

      - name: Ejecutar pg_dump (Conexión URI y PG17)
        env:
          DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          DB_USER: postgres.qhjditntqtjiljeftqun
        run: |
          echo "Iniciando respaldo de base de datos..."
          
          # Usando el formato URI aseguramos que PostgreSQL ensamble los datos
          CONNECTION_STRING="postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:5432/postgres"
          
          # Forzamos el uso exacto del binario de la versión 17 instalado en el runner
          /usr/lib/postgresql/17/bin/pg_dump "$CONNECTION_STRING" \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            --schema=public \
            --verbose \
            > ${{ steps.filename.outputs.name }}
            
          echo "Archivo generado con éxito. Comprimiendo..."
          gzip ${{ steps.filename.outputs.name }}
          ls -lh ${{ steps.filename.outputs.name }}.gz

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.name }}
          path: ${{ steps.filename.outputs.name }}.gz
          retention-days: 90

      - name: Reportar resultado
        if: success()
        run: echo "✅ Backup exitoso. Retención 90 días."
