<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#325926",
                    "background-light": "#f7f7f6",
                    "background-dark": "#171d15",
                },
                fontFamily: { "display": ["Inter", "sans-serif"] },
                borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
        },
    }
</script>
<title>Configura tu perfil · ViveroOnline</title>
<style>
    body { min-height: max(884px, 100dvh); }
    .role-card {
        transition: all 0.2s;
        cursor: pointer;
    }
    .role-card[data-selected="true"] {
        border-color: #325926;
        background: linear-gradient(135deg, rgba(50,89,38,0.06), rgba(50,89,38,0.01));
        box-shadow: 0 0 0 3px rgba(50,89,38,0.12);
    }
    .role-card:hover:not([data-selected="true"]) {
        border-color: rgba(50,89,38,0.3);
    }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">

<div class="flex flex-col min-h-screen max-w-md mx-auto px-6 py-8">

    <!-- Step indicator -->
    <div class="flex items-center gap-2 mb-8">
        <div id="dot-1" class="w-8 h-1 rounded-full bg-primary"></div>
        <div id="dot-2" class="w-8 h-1 rounded-full bg-slate-200 dark:bg-slate-700"></div>
    </div>

    <!-- STEP 1: Elegir rol -->
    <div id="step-role" class="flex-1">
        <h1 class="text-3xl font-black leading-tight tracking-tight mb-3">
            ¿Cómo quieres<br>
            <span class="text-primary">usar ViveroOnline?</span>
        </h1>
        <p class="text-slate-600 dark:text-slate-400 text-base mb-8">
            Puedes cambiar esto después en tu perfil.
        </p>

        <div class="space-y-3 mb-8">
            <!-- Card: Viverista -->
            <button type="button" data-role="viverista" class="role-card w-full text-left p-5 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-lg">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-primary text-2xl">forest</span>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-lg mb-1">Soy Viverista</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400">
                            Tengo un vivero y quiero vender mis plantas a paisajistas, constructoras y empresas.
                        </p>
                        <div class="flex flex-wrap gap-1 mt-3">
                            <span class="text-xs px-2 py-1 bg-primary/10 text-primary rounded-full font-semibold">Catálogo con IA</span>
                            <span class="text-xs px-2 py-1 bg-primary/10 text-primary rounded-full font-semibold">Precios sugeridos</span>
                        </div>
                    </div>
                </div>
            </button>

            <!-- Card: Comprador -->
            <button type="button" data-role="comprador" class="role-card w-full text-left p-5 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-lg">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-primary text-2xl">architecture</span>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-lg mb-1">Soy Comprador B2B</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400">
                            Represento una constructora, paisajista, conjunto residencial o empresa y necesito plantas al por mayor.
                        </p>
                        <div class="flex flex-wrap gap-1 mt-3">
                            <span class="text-xs px-2 py-1 bg-primary/10 text-primary rounded-full font-semibold">Marketplace</span>
                            <span class="text-xs px-2 py-1 bg-primary/10 text-primary rounded-full font-semibold">Pedidos masivos</span>
                        </div>
                    </div>
                </div>
            </button>
        </div>

        <button
            id="continue-btn"
            type="button"
            disabled
            class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-full flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition disabled:opacity-40 disabled:cursor-not-allowed"
        >
            <span>Continuar</span>
            <span class="material-symbols-outlined">arrow_forward</span>
        </button>
    </div>

    <!-- STEP 2: Datos del perfil -->
    <div id="step-profile" class="hidden flex-1">
        <button type="button" id="back-btn" class="material-symbols-outlined text-slate-700 dark:text-slate-300 p-2 -ml-2 mb-4 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition">arrow_back</button>

        <!-- Banner de rol elegido (NUEVO) -->
        <div id="role-banner" class="mb-6 p-4 bg-primary/5 dark:bg-primary/10 border-2 border-primary/20 rounded-lg flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                    <span id="role-banner-icon" class="material-symbols-outlined text-primary">forest</span>
                </div>
                <div class="min-w-0">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Te estás registrando como</p>
                    <p id="role-banner-name" class="font-bold text-base truncate">Viverista</p>
                </div>
            </div>
            <button type="button" id="change-role-btn" class="text-xs font-bold text-primary hover:underline whitespace-nowrap px-2 py-1 rounded">
                Cambiar
            </button>
        </div>

        <h1 class="text-3xl font-black leading-tight tracking-tight mb-3">
            Cuéntanos<br>
            <span class="text-primary" id="profile-heading">de tu vivero</span>
        </h1>
        <p class="text-slate-600 dark:text-slate-400 text-base mb-8">
            Completa tus datos para terminar el registro.
        </p>

        <form id="profile-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                    Nombre completo *
                </label>
                <input
                    id="f-nombre"
                    type="text"
                    required
                    placeholder="Carlos Pérez"
                    class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition"
                >
            </div>

            <!-- Viverista only -->
            <div id="grp-vivero" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                        Nombre del vivero *
                    </label>
                    <input
                        id="f-nombre-vivero"
                        type="text"
                        placeholder="Vivero Las Margaritas"
                        class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition"
                    >
                </div>
            </div>

            <!-- Comprador only -->
            <div id="grp-empresa" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                        Empresa / organización
                    </label>
                    <input
                        id="f-empresa"
                        type="text"
                        placeholder="Paisajismo XYZ SAS"
                        class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition"
                    >
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                        Tipo de comprador
                    </label>
                    <select
                        id="f-tipo-comprador"
                        class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition"
                    >
                        <option value="paisajista">Paisajista / Arquitecto</option>
                        <option value="constructora">Constructora</option>
                        <option value="conjunto">Conjunto residencial</option>
                        <option value="empresa">Empresa / Oficina</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                        Municipio *
                    </label>
                    <select
                        id="f-municipio"
                        required
                        class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition"
                    >
                        <option value="">Selecciona</option>
                        <option>Cajicá</option>
                        <option>Chía</option>
                        <option>Zipaquirá</option>
                        <option>Sopó</option>
                        <option>La Calera</option>
                        <option>Tabio</option>
                        <option>Tenjo</option>
                        <option>Facatativá</option>
                        <option>Madrid</option>
                        <option>Mosquera</option>
                        <option>Funza</option>
                        <option>Cota</option>
                        <option>Tocancipá</option>
                        <option>Bogotá D.C.</option>
                        <option>Otro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
                        NIT / Cédula
                    </label>
                    <input
                        id="f-nit"
                        type="text"
                        inputmode="numeric"
                        placeholder="900123456"
                        class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-DEFAULT focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition"
                    >
                </div>
            </div>

            <!-- Habeas data -->
            <label class="flex items-start gap-3 p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-DEFAULT cursor-pointer">
                <input
                    id="f-habeas"
                    type="checkbox"
                    required
                    class="mt-1 rounded text-primary focus:ring-primary/40"
                >
                <span class="text-sm text-slate-700 dark:text-slate-300">
                    Acepto el tratamiento de mis datos personales según la
                    <a href="/habeas-data" class="text-primary font-semibold underline">Ley 1581 de 2012</a>.
                </span>
            </label>

            <div id="error-box" class="hidden rounded-DEFAULT bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3"></div>

            <button
                type="submit"
                id="submit-btn"
                class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-full flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition disabled:opacity-60 disabled:cursor-not-allowed"
            >
                <span id="btn-text">Finalizar registro</span>
                <span id="btn-spinner" class="hidden material-symbols-outlined animate-spin">progress_activity</span>
            </button>
        </form>
    </div>
</div>

<script>
// ─── 1. Capturar rol intencionado del URL ANTES de cualquier redirect ───
// Esto sobrevive el flujo OTP: el usuario hace click "Soy Viverista" en landing,
// llega acá sin token, lo guardamos en localStorage, lo redirigimos a /auth/ingresar,
// hace OTP, vuelve acá, y leemos el rol del localStorage.
const VALID_ROLES = ['viverista', 'comprador'];
const urlParams = new URLSearchParams(window.location.search);
const urlRol = urlParams.get('rol');
if (urlRol && VALID_ROLES.includes(urlRol)) {
    localStorage.setItem('vivero_intended_rol', urlRol);
}

// ─── 2. Verificar auth (puede redirigir si no hay token) ───
const token = localStorage.getItem('vivero_access_token');
if (!token) window.location.href = '/auth/ingresar';

// ─── 3. Determinar rol intencionado (URL tiene precedencia, luego localStorage) ───
const intendedRol = (urlRol && VALID_ROLES.includes(urlRol))
    ? urlRol
    : localStorage.getItem('vivero_intended_rol');

let selectedRole = null;
const continueBtn = document.getElementById('continue-btn');
const roleCards = document.querySelectorAll('.role-card');

roleCards.forEach(card => {
    card.addEventListener('click', () => {
        roleCards.forEach(c => c.dataset.selected = 'false');
        card.dataset.selected = 'true';
        selectedRole = card.dataset.role;
        continueBtn.disabled = false;
    });
});

// ─── 4. Funciones de navegación entre steps ───
function goToStep2() {
    document.getElementById('step-role').classList.add('hidden');
    document.getElementById('step-profile').classList.remove('hidden');
    document.getElementById('dot-2').classList.remove('bg-slate-200', 'dark:bg-slate-700');
    document.getElementById('dot-2').classList.add('bg-primary');

    // Configurar form según rol
    if (selectedRole === 'viverista') {
        document.getElementById('profile-heading').textContent = 'de tu vivero';
        document.getElementById('grp-vivero').classList.remove('hidden');
        document.getElementById('grp-empresa').classList.add('hidden');
        document.getElementById('f-nombre-vivero').required = true;
    } else {
        document.getElementById('profile-heading').textContent = 'de tu empresa';
        document.getElementById('grp-vivero').classList.add('hidden');
        document.getElementById('grp-empresa').classList.remove('hidden');
        document.getElementById('f-nombre-vivero').required = false;
    }

    // Actualizar banner con rol actual
    const bannerName = document.getElementById('role-banner-name');
    const bannerIcon = document.getElementById('role-banner-icon');
    if (selectedRole === 'viverista') {
        bannerName.textContent = 'Viverista';
        bannerIcon.textContent = 'forest';
    } else {
        bannerName.textContent = 'Comprador B2B';
        bannerIcon.textContent = 'architecture';
    }

    // Scroll arriba en mobile
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToStep1() {
    document.getElementById('step-profile').classList.add('hidden');
    document.getElementById('step-role').classList.remove('hidden');
    document.getElementById('dot-2').classList.add('bg-slate-200', 'dark:bg-slate-700');
    document.getElementById('dot-2').classList.remove('bg-primary');
    // Limpiar el intended rol para que no se vuelva a auto-saltar al volver atrás
    history.replaceState(null, '', '/auth/onboarding');
    localStorage.removeItem('vivero_intended_rol');
}

continueBtn.addEventListener('click', goToStep2);
document.getElementById('back-btn').addEventListener('click', backToStep1);
document.getElementById('change-role-btn').addEventListener('click', backToStep1);

// ─── 5. Auto-skip a Step 2 si el rol viene del URL o localStorage ───
if (intendedRol && VALID_ROLES.includes(intendedRol)) {
    selectedRole = intendedRol;
    const card = document.querySelector(`[data-role="${intendedRol}"]`);
    if (card) {
        roleCards.forEach(c => c.dataset.selected = 'false');
        card.dataset.selected = 'true';
        continueBtn.disabled = false;
        goToStep2();
    }
}

// ─── 6. Submit del form ───
const form = document.getElementById('profile-form');
const errorBox = document.getElementById('error-box');
const btn = document.getElementById('submit-btn');
const btnText = document.getElementById('btn-text');
const btnSpinner = document.getElementById('btn-spinner');

function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
}
function hideError() { errorBox.classList.add('hidden'); }

function setLoading(loading) {
    btn.disabled = loading;
    btnText.textContent = loading ? 'Guardando...' : 'Finalizar registro';
    btnSpinner.classList.toggle('hidden', !loading);
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    if (!selectedRole) {
        showError('Por favor seleccioná un rol antes de continuar.');
        return;
    }

    const payload = {
        rol: selectedRole,
        nombre: document.getElementById('f-nombre').value.trim(),
        municipio: document.getElementById('f-municipio').value,
        nit: document.getElementById('f-nit').value.trim() || null,
        habeas_data: document.getElementById('f-habeas').checked,
    };

    if (selectedRole === 'viverista') {
        payload.nombre_vivero = document.getElementById('f-nombre-vivero').value.trim();
    } else {
        payload.empresa = document.getElementById('f-empresa').value.trim() || null;
        payload.tipo_comprador = document.getElementById('f-tipo-comprador').value;
    }

    setLoading(true);

    try {
        const res = await fetch('/api/auth/onboarding', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'No se pudo completar el registro.');

        // Limpiar el rol intencionado: el onboarding terminó
        localStorage.removeItem('vivero_intended_rol');

        // Redirigir según rol
        if (selectedRole === 'viverista') {
            window.location.href = '/viverista';
        } else {
            window.location.href = '/comprador';
        }
    } catch (err) {
        showError(err.message);
        setLoading(false);
    }
});
</script>
<script src="/static/js/vivero.js"></script>
</body>
</html>
