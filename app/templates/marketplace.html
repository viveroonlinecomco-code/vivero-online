<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<title>Marketplace · viveroonline.com.co</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#325926",
                    "background-light": "#f7f7f6",
                    "background-dark": "#171d15",
                },
                fontFamily: {
                    "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
        },
    }
</script>
<style>
    body { min-height: max(884px, 100dvh); }
    /* Extra padding-bottom si hay widget carrito */
    body.has-cart-widget { padding-bottom: 100px; }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">

<!-- Header sticky con brand + login + buscador -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <span class="material-symbols-outlined text-primary text-3xl">energy_savings_leaf</span>
            <h2 class="text-base md:text-lg font-bold leading-tight tracking-tight">viveroonline.com.co</h2>
        </a>
        <a data-vo="header-action" href="/auth/ingresar" class="inline-flex items-center gap-1 text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary transition-colors px-4 py-2 rounded-full whitespace-nowrap">
            Iniciar Sesión
        </a>
    </div>
    <div class="max-w-7xl mx-auto px-4 pb-3">
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
            <input data-vo="search-input" type="search" placeholder="Buscar plantas..." class="w-full h-12 pl-10 pr-4 bg-white dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-sm shadow-sm">
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Intro -->
    <div class="mb-6">
        <h1 class="text-2xl md:text-3xl font-black tracking-tight">Marketplace</h1>
        <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">
            Plantas ornamentales de viveros de la Sabana de Bogotá. <span data-vo="auth-note"></span>
        </p>
    </div>

    <!-- Loading skeleton -->
    <div data-vo="state-loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm animate-pulse">
            <div class="h-48 bg-slate-200 dark:bg-slate-700"></div>
            <div class="p-4 space-y-3">
                <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
            </div>
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm animate-pulse">
            <div class="h-48 bg-slate-200 dark:bg-slate-700"></div>
            <div class="p-4 space-y-3">
                <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
            </div>
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm animate-pulse hidden md:block">
            <div class="h-48 bg-slate-200 dark:bg-slate-700"></div>
            <div class="p-4 space-y-3">
                <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
                <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
            </div>
        </div>
    </div>

    <!-- List rendered by JS -->
    <div data-vo="state-list" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- Empty state -->
    <div data-vo="state-empty" class="hidden text-center py-16">
        <span class="material-symbols-outlined text-6xl text-slate-300 dark:text-slate-700">eco</span>
        <p class="text-slate-500 dark:text-slate-400 mt-4 text-lg">No encontramos plantas disponibles.</p>
        <p class="text-slate-400 text-sm mt-1">Probá con otra búsqueda o volvé más tarde.</p>
    </div>

    <!-- Error state -->
    <div data-vo="state-error" class="hidden text-center py-16">
        <span class="material-symbols-outlined text-6xl text-red-300">error_outline</span>
        <p class="text-slate-500 dark:text-slate-400 mt-4 text-lg">No pudimos cargar el marketplace.</p>
        <button onclick="window.location.reload()" class="mt-4 inline-flex items-center gap-2 px-5 py-2 bg-primary text-white rounded-full font-bold text-sm">
            <span class="material-symbols-outlined text-base">refresh</span>
            Reintentar
        </button>
    </div>

</main>

<!-- ═══════════ Widget carrito guest (sticky bottom) ═══════════ -->
<div data-vo="cart-widget" class="hidden fixed bottom-4 left-0 right-0 z-40 px-4 pointer-events-none">
    <div class="max-w-7xl mx-auto pointer-events-auto">
        <a href="/carrito-guest" class="flex items-center justify-between bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-4 rounded-full shadow-xl shadow-emerald-600/40 transition">
            <span class="flex items-center gap-2 font-semibold">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span>Ver carrito · <span data-vo="cart-widget-count"></span></span>
            </span>
            <span class="font-black text-lg" data-vo="cart-widget-total"></span>
        </a>
    </div>
</div>

<script src="/static/js/vivero.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// FASE 8 (24 jul 2026) — Marketplace con soporte guest B2C
//
// Cambios respecto a versión Fase 4:
// - FIX: eliminado fallback "× 1.18" hardcoded en el precio
//   (usa item.precio_comprador que el backend garantiza con motor matricial)
// - Widget carrito guest sticky (aparece si localStorage tiene items)
// - Copy intro adaptado según rol (guest: comprar / B2B: cotizar)
//
// El endpoint /api/public/marketplace ya está filtrando tier S+M para guest,
// así que este template NO tiene que filtrar manualmente. Solo pinta lo que
// llega del backend.
// ═══════════════════════════════════════════════════════════════════

// ── Utilidades carrito guest (compartidas con marketplace_detalle.html) ─
const CART_KEY = 'vivero_guest_cart';

function cartRead() {
    try {
        const raw = localStorage.getItem(CART_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch { return []; }
}

function cartTotalItems() {
    return cartRead().reduce((sum, it) => sum + (it.cantidad || 0), 0);
}

function cartTotalCOP() {
    return cartRead().reduce(
        (sum, it) => sum + ((it.precio_comprador_unitario || 0) * (it.cantidad || 0)),
        0
    );
}

(async function init() {
    const $ = (sel) => document.querySelector(sel);
    const stateLoading = $('[data-vo="state-loading"]');
    const stateList = $('[data-vo="state-list"]');
    const stateEmpty = $('[data-vo="state-empty"]');
    const stateError = $('[data-vo="state-error"]');
    const searchInput = $('[data-vo="search-input"]');
    const headerAction = $('[data-vo="header-action"]');
    const authNote = $('[data-vo="auth-note"]');

    // ─── Detectar sesión ───
    let me = null;
    if (VO.getToken && VO.getToken()) {
        try { me = await VO.me(); } catch { me = null; }
    }

    // ─── Header dinámico según sesión ───
    if (me) {
        const panelPath = me.rol === 'viverista' ? '/viverista'
                       : me.rol === 'comprador' ? '/comprador'
                       : me.rol === 'admin' ? '/admin'
                       : '/';
        headerAction.href = panelPath;
        headerAction.innerHTML = '<span class="material-symbols-outlined text-base">dashboard</span> Mi panel';
    }

    // ─── Copy intro según rol (Fase 8) ───
    if (me && (me.rol === 'comprador' || me.rol === 'admin')) {
        authNote.textContent = 'Hacé click en una planta para cotizar.';
    } else if (me) {
        authNote.textContent = 'Hacé click en una planta para ver el detalle.';
    } else {
        // Guest B2C
        authNote.innerHTML = 'Comprá directo desde ' + (Math.min(10, 10) ? '1 hasta 10 unidades por producto' : '') + '. <a href="/auth/registro?tipo=empresa" class="text-primary font-semibold hover:underline">¿Sos empresa?</a>';
    }

    // ─── State machine ───
    function setState(s) {
        [stateLoading, stateList, stateEmpty, stateError].forEach(el => el && el.classList.add('hidden'));
        const target = { loading: stateLoading, list: stateList, empty: stateEmpty, error: stateError }[s];
        if (target) target.classList.remove('hidden');
    }

    // ─── Helpers ───
    function escapeHTML(str) {
        if (str == null) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ─── Render ───
    function renderItems(items) {
        if (!items.length) { setState('empty'); return; }
        stateList.innerHTML = items.map(item => {
            const foto = item.foto_ia_url ? escapeHTML(item.foto_ia_url) : '';
            const nombre = escapeHTML(item.nombre_comun || 'Sin nombre');
            const cientifico = escapeHTML(item.nombre_cientifico || '');
            const vivero = escapeHTML(item.nombre_vivero || 'Vivero');
            const municipio = escapeHTML(item.municipio || '');
            const distancia = item.distancia_km ? `${item.distancia_km.toFixed(1)} km` : '';
            // ── FIX Fase 4: sin fallback × 1.18. Backend garantiza precio_comprador ──
            const precio = VO.formatCOPFull(item.precio_comprador || 0);
            const stock = item.stock || 0;
            const meta = [vivero, municipio, distancia].filter(Boolean).join(' · ');

            // CTA label: guest ve "Comprar", B2B ve "Ver detalle"
            const ctaLabel = me ? 'Ver detalle' : 'Comprar';
            const ctaIcon = me ? 'chevron_right' : 'shopping_bag';

            return `
                <a href="/marketplace/producto/${item.inventario_id}" class="block bg-white dark:bg-slate-800 rounded-2xl overflow-hidden shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-lg transition-shadow">
                    <div class="h-48 bg-primary/10 bg-cover bg-center" ${foto ? `style="background-image: url('${foto}');"` : ''}>
                        ${!foto ? '<div class="h-full flex items-center justify-center"><span class="material-symbols-outlined text-5xl text-primary/30">eco</span></div>' : ''}
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2 gap-2">
                            <div class="min-w-0 flex-1">
                                <h3 class="text-base font-bold truncate">${nombre}</h3>
                                ${cientifico ? `<p class="text-xs text-slate-500 italic truncate">${cientifico}</p>` : ''}
                            </div>
                            <span class="text-lg font-black text-primary whitespace-nowrap">${precio}</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-3 flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm">storefront</span>
                            <span class="truncate">${meta}</span>
                        </p>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-700">
                            <span class="text-xs text-slate-500">${stock} disponibles</span>
                            <span class="text-primary font-bold text-sm inline-flex items-center gap-1">
                                ${ctaLabel}
                                <span class="material-symbols-outlined text-base">${ctaIcon}</span>
                            </span>
                        </div>
                    </div>
                </a>
            `;
        }).join('');
        setState('list');
    }

    // ─── Fetch (auth-aware) ───
    async function loadItems(q = '') {
        setState('loading');
        try {
            const params = new URLSearchParams();
            if (q) params.set('q', q);
            const qs = params.toString() ? '?' + params.toString() : '';

            let data;
            if (me) {
                // Autenticado: endpoint completo (incluye contactos)
                data = await VO.api('/api/marketplace' + (qs ? qs + '&limite=120' : '?limite=120'));
            } else {
                // Guest B2C: endpoint público (tier S+M, sanitizado, sin auth)
                const resp = await fetch('/api/public/marketplace' + qs);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                data = await resp.json();
            }
            renderItems(data.items || []);
        } catch (e) {
            console.error('Error cargando marketplace:', e);
            setState('error');
        }
    }

    // ─── Buscador con debounce ───
    if (searchInput) {
        let timer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timer);
            timer = setTimeout(() => loadItems(e.target.value.trim()), 400);
        });
    }

    // ─── Widget carrito guest (solo si no está logueado y hay items) ───
    function actualizarCarritoWidget() {
        if (me) return; // widget solo aplica a guest
        const items = cartRead();
        const widget = $('[data-vo="cart-widget"]');
        if (items.length === 0) {
            widget.classList.add('hidden');
            document.body.classList.remove('has-cart-widget');
            return;
        }
        const totalItems = cartTotalItems();
        const totalCOP = cartTotalCOP();
        $('[data-vo="cart-widget-count"]').textContent = totalItems === 1 ? '1 planta' : `${totalItems} plantas`;
        $('[data-vo="cart-widget-total"]').textContent = VO.formatCOPFull(totalCOP);
        widget.classList.remove('hidden');
        document.body.classList.add('has-cart-widget');
    }
    actualizarCarritoWidget();

    // Escuchar cambios en localStorage (por si abre otra pestaña y modifica)
    window.addEventListener('storage', (e) => {
        if (e.key === CART_KEY) actualizarCarritoWidget();
    });

    await loadItems();
})();
</script>
</body>
</html>
