<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Detalle del producto · ViveroOnline.com.co</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#325926",
                    "background-light": "#f7f7f6",
                    "background-dark": "#171d15",
                },
                fontFamily: {
                    "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
        },
    }
</script>
<style>
    body { min-height: max(884px, 100dvh); }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 pb-32">

<!-- Header sticky -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
            <span class="material-symbols-outlined text-primary text-3xl">energy_savings_leaf</span>
            <h2 class="text-base md:text-lg font-bold leading-tight tracking-tight">ViveroOnline.com.co</h2>
        </a>
        <a data-vo="header-action" href="/auth/ingresar" class="inline-flex items-center gap-1 text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary transition-colors px-4 py-2 rounded-full whitespace-nowrap">
            Iniciar Sesión
        </a>
    </div>
    <div class="max-w-3xl mx-auto px-4 pb-3">
        <a href="/marketplace" class="inline-flex items-center gap-1 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-base">arrow_back</span>
            Volver al marketplace
        </a>
    </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6">

    <!-- Loading skeleton -->
    <div data-vo="state-loading" class="animate-pulse space-y-4">
        <div class="aspect-square w-full bg-slate-200 dark:bg-slate-700 rounded-xl"></div>
        <div class="space-y-2">
            <div class="h-7 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>
            <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
        </div>
        <div class="h-24 bg-slate-200 dark:bg-slate-700 rounded-xl"></div>
        <div class="h-24 bg-slate-200 dark:bg-slate-700 rounded-xl"></div>
    </div>

    <!-- Content rendered by JS -->
    <div data-vo="state-content" class="hidden space-y-6">

        <!-- Foto principal -->
        <div data-vo="foto" class="aspect-square w-full rounded-xl overflow-hidden bg-primary/10 bg-cover bg-center relative">
            <div data-vo="foto-fallback" class="hidden absolute inset-0 flex items-center justify-center">
                <span class="material-symbols-outlined text-7xl text-primary/30">eco</span>
            </div>
        </div>

        <!-- Título + precio + stock -->
        <section>
            <div class="flex justify-between items-start gap-4">
                <div class="min-w-0 flex-1">
                    <h1 data-vo="nombre" class="text-3xl font-black leading-tight"></h1>
                    <p data-vo="cientifico" class="text-primary font-medium italic mt-1"></p>
                </div>
                <div class="text-right shrink-0">
                    <p data-vo="precio" class="text-2xl md:text-3xl font-black text-primary whitespace-nowrap"></p>
                    <p data-vo="precio-detal" class="hidden text-xs text-slate-500 mt-1"></p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2 mt-3">
                <span class="material-symbols-outlined text-emerald-600 text-base">check_circle</span>
                <span data-vo="stock-info" class="text-sm font-semibold text-emerald-600 uppercase tracking-wider"></span>
                <span data-vo="altura-info" class="text-sm text-slate-500"></span>
            </div>
        </section>

        <!-- Vivero -->
        <section class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-100 dark:border-slate-700">
            <h3 class="font-bold text-sm text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-1">
                <span class="material-symbols-outlined text-base text-primary">storefront</span>
                Vivero
            </h3>
            <p data-vo="vivero-nombre" class="text-lg font-bold"></p>
            <p data-vo="vivero-ciudad" class="text-sm text-slate-500 mb-4"></p>

            <!-- Contactos (solo autenticados) -->
            <div data-vo="contacto-autenticado" class="hidden flex-wrap gap-2">
                <a data-vo="contacto-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="hidden items-center gap-1 bg-emerald-500 text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-emerald-600 transition-colors">
                    <span class="material-symbols-outlined text-base">chat</span>
                    WhatsApp
                </a>
                <a data-vo="contacto-telefono" href="#" class="hidden items-center gap-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold hover:bg-slate-200 transition-colors">
                    <span class="material-symbols-outlined text-base">call</span>
                    Llamar
                </a>
                <a data-vo="vivero-mapa" href="#" target="_blank" rel="noopener noreferrer" class="hidden items-center gap-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold hover:bg-slate-200 transition-colors">
                    <span class="material-symbols-outlined text-base">map</span>
                    Ver en mapa
                </a>
            </div>

            <!-- Contacto bloqueado (anónimos) -->
            <div data-vo="contacto-anonimo" class="hidden bg-primary/5 dark:bg-primary/10 rounded-lg p-4 items-start gap-3">
                <span class="material-symbols-outlined text-primary text-2xl">lock</span>
                <div class="flex-1">
                    <p class="text-sm font-semibold">Iniciá sesión para contactar al vivero</p>
                    <p class="text-xs text-slate-500 mt-1">El contacto directo (WhatsApp y teléfono) requiere cuenta.</p>
                    <a href="/auth/ingresar" class="inline-flex items-center gap-1 text-primary font-bold text-sm mt-2 hover:underline">
                        Iniciar Sesión
                        <span class="material-symbols-outlined text-base">arrow
