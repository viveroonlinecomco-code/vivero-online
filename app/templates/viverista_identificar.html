<script>
if (!VO.requireAuth()) throw new Error('auth');

let estadoIdentificacion = 'inicial'; // inicial | subiendo | analizando | listo
let ultimoAnalisis = null;

document.addEventListener('DOMContentLoaded', () => {
    const camaraArea = document.querySelector('.aspect-square') || document.querySelector('[class*="aspect-"]');
    if (!camaraArea) return;

    // Crear input de archivo oculto
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    document.body.appendChild(input);

    // Al hacer click en cualquier botón de la cámara, disparar input
    const botones = camaraArea.querySelectorAll('button');
    botones.forEach(b => {
        b.addEventListener('click', (e) => {
            e.preventDefault();
            input.click();
        });
    });

    input.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        // Mostrar preview
        const previewUrl = URL.createObjectURL(file);
        const img = camaraArea.querySelector('img') || camaraArea.querySelector('[style*="background"]');
        if (img && img.tagName === 'IMG') {
            img.src = previewUrl;
        } else if (img) {
            img.style.backgroundImage = `url('${previewUrl}')`;
        }

        // Estado: analizando
        estadoIdentificacion = 'analizando';
        const tituloAnalisis = document.querySelector('h2, h3');
        const progressText = Array.from(document.querySelectorAll('p, span')).find(el =>
            el.textContent?.includes('%') || el.textContent?.toLowerCase().includes('analiz')
        );

        // Enviar a la API
        try {
            VO.showToast('Analizando con IA...', 'info');
            const formData = new FormData();
            formData.append('imagen', file);

            const token = VO.getToken();
            const res = await fetch('/api/catalogo/identificar', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData,
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Error');

            ultimoAnalisis = data;
            estadoIdentificacion = 'listo';

            // Render resultado
            mostrarResultadoIA(data);
        } catch (err) {
            VO.showToast(err.message || 'Error al identificar', 'error');
            estadoIdentificacion = 'inicial';
        }
    });

    // Botón "Generar Inventario"
    const generarBtn = Array.from(document.querySelectorAll('button')).find(b =>
        (b.textContent || '').trim().toLowerCase().includes('generar inventario') ||
        (b.textContent || '').trim().toLowerCase().includes('generar')
    );
    if (generarBtn) {
        generarBtn.addEventListener('click', async () => {
            if (!ultimoAnalisis) {
                VO.showToast('Primero sube una foto', 'error');
                return;
            }
            await guardarEnInventario(ultimoAnalisis);
        });
    }
});

function mostrarResultadoIA(data) {
    const a = data.analisis;
    // Actualizar nombre, confianza, detalles en la card del resultado
    const cards = document.querySelectorAll('[class*="rounded"][class*="bg-"]');
    // Buscar "match" y reemplazar
    document.querySelectorAll('*').forEach(el => {
        const t = (el.textContent || '').trim();
        if (/^\d+%\s*Match$/i.test(t) || /match/i.test(t) && t.length < 20) {
            el.textContent = `${Math.round((a.confianza || 0) * 100)}% Match`;
        }
    });
    // Sustituir nombre común
    const h2s = document.querySelectorAll('h2, h3, p.font-bold');
    h2s.forEach(el => {
        if (/monstera/i.test(el.textContent)) {
            el.textContent = a.nombre_comun || 'Planta identificada';
        }
    });
    VO.showToast(`Identificado: ${a.nombre_comun} (${Math.round(a.confianza*100)}%)`, 'success');
}

async function guardarEnInventario(data) {
    const a = data.analisis;
    const precio = prompt(`Precio mayorista sugerido: $${(a.precio_estimado_cop||0).toLocaleString('es-CO')} COP\n\nConfirma el precio en COP:`, a.precio_estimado_cop || '');
    if (!precio) return;
    const stock = prompt('¿Cuántas unidades tienes en stock?', '10');
    if (!stock) return;

    try {
        await VO.api('/api/catalogo/guardar', {
            method: 'POST',
            body: JSON.stringify({
                planta_id: data.planta_id || null,
                nombre_comun: a.nombre_comun,
                nombre_cientifico: a.nombre_cientifico,
                foto_url: data.foto_url,
                precio_mayorista: parseInt(precio),
                stock: parseInt(stock),
                altura_cm: a.altura_cm_estimada || 30,
                confianza_yolo: a.confianza,
            }),
        });
        VO.showToast('¡Agregado a tu inventario!', 'success');
        setTimeout(() => window.location.href = '/viverista', 1500);
    } catch (err) {
        VO.showToast(err.message, 'error');
    }
}
</script>


<script src="/static/js/vivero.js"></script>

<script>
(async function() {
    if (!VO.requireAuth()) return;

    const photoInput = document.querySelector('[data-vo="file-input"]') || document.createElement('input');
    const cameraBtn = document.querySelector('[data-vo="camera-btn"]');
    const analyzeBox = document.querySelector('[data-vo="analyze-box"]');
    const resultBox = document.querySelector('[data-vo="result-box"]');
    const saveBtn = document.querySelector('[data-vo="save-btn"]');
    const progressBar = document.querySelector('[data-vo="progress-bar"]');
    const progressPct = document.querySelector('[data-vo="progress-pct"]');

    let lastAnalysis = null;

    async function handleImage(file) {
        if (!file) return;
        if (analyzeBox) analyzeBox.style.display = 'block';
        if (resultBox) resultBox.style.display = 'none';
        if (progressBar) progressBar.style.width = '15%';
        if (progressPct) progressPct.textContent = '15%';

        const form = new FormData();
        form.append('imagen', file);

        try {
            // Simulación visual del progreso
            let pct = 15;
            const tick = setInterval(() => {
                pct = Math.min(pct + 8, 85);
                if (progressBar) progressBar.style.width = pct + '%';
                if (progressPct) progressPct.textContent = pct + '%';
            }, 400);

            const res = await fetch('/api/catalogo/identificar', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${VO.getToken()}` },
                body: form,
            });
            clearInterval(tick);
            const data = await res.json();

            if (!res.ok) throw new Error(data.detail || 'Error al identificar');

            if (progressBar) progressBar.style.width = '100%';
            if (progressPct) progressPct.textContent = '100%';

            lastAnalysis = { ...data.analisis, foto_url: data.foto_url, planta_id: data.planta_id };
            renderResult(lastAnalysis);
        } catch (err) {
            VO.showToast(err.message, 'error');
            if (analyzeBox) analyzeBox.style.display = 'none';
        }
    }

    function renderResult(a) {
        if (!resultBox) return;
        resultBox.style.display = 'flex';
        const nomCom = resultBox.querySelector('[data-vo="res-nombre"]');
        const nomCie = resultBox.querySelector('[data-vo="res-cientifico"]');
        const conf = resultBox.querySelector('[data-vo="res-confianza"]');
        const img = resultBox.querySelector('[data-vo="res-foto"]');
        if (nomCom) nomCom.textContent = a.nombre_comun || '—';
        if (nomCie) nomCie.textContent = a.nombre_cientifico || '';
        if (conf) conf.textContent = Math.round((a.confianza || 0) * 100) + '% Match';
        if (img && a.foto_url) img.style.backgroundImage = `url('${a.foto_url}')`;
    }

    // Listener para el file input
    if (photoInput) {
        photoInput.type = 'file';
        photoInput.accept = 'image/*';
        photoInput.style.display = 'none';
        document.body.appendChild(photoInput);
        photoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleImage(e.target.files[0]);
        });
    }

    if (cameraBtn) {
        cameraBtn.addEventListener('click', (e) => {
            e.preventDefault();
            photoInput.click();
        });
    }

    if (saveBtn) {
        saveBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            if (!lastAnalysis) return VO.showToast('Primero identifica una planta', 'error');

            // Prompt simple para completar precio y stock (en v1 es dialog nativo; después se refina)
            const precio = prompt('Precio mayorista en COP (sugerido: ' + (lastAnalysis.precio_estimado_cop || 25000) + '):', lastAnalysis.precio_estimado_cop || 25000);
            if (!precio) return;
            const stock = prompt('¿Cuántas unidades tienes en stock?', '10');
            if (!stock) return;

            try {
                await VO.api('/api/catalogo/guardar', {
                    method: 'POST',
                    body: JSON.stringify({
                        planta_id: lastAnalysis.planta_id,
                        nombre_comun: lastAnalysis.nombre_comun,
                        nombre_cientifico: lastAnalysis.nombre_cientifico,
                        foto_url: lastAnalysis.foto_url,
                        precio_mayorista: parseInt(precio),
                        stock: parseInt(stock),
                        altura_cm: lastAnalysis.altura_cm_estimada || 30,
                        unidad_medida: 'unidad',
                        confianza_yolo: lastAnalysis.confianza,
                    }),
                });
                VO.showToast('Planta agregada a tu inventario', 'success');
                setTimeout(() => window.location.href = '/viverista', 1200);
            } catch (err) {
                VO.showToast(err.message, 'error');
            }
        });
    }
})();
</script>
